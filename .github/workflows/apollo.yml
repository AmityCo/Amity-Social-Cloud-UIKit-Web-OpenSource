# Apollo gate — drop this into a platform repo as .github/workflows/apollo.yml
#
# Requires, in that repo:
#   secret   CLEVERDEN_TOKEN   read access to the spec repo
#   variable APOLLO_PLATFORM   the repo key, e.g. iosUikitPrivate
#   file     .apollo/baseline.json  (apollo baseline, committed)
#
# Both gates are ratcheted against that committed baseline, so they pass on a
# repo that has pre-existing debt and fail the moment a PR adds to it. An
# un-ratcheted spec gate blocks every PR on the whole backlog, which means it
# gets switched off in a week and stops catching the regressions it was for.
name: Apollo

on:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo

      - name: Check for the cleverden token
        id: gate
        run: echo "have=${{ secrets.CLEVERDEN_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Skip without credentials
        if: steps.gate.outputs.have != 'true'
        run: echo "::notice::CLEVERDEN_TOKEN is not set — Apollo needs read access to the spec repo. Skipping."

      - uses: actions/checkout@v4
        if: steps.gate.outputs.have == 'true'
        with:
          repository: AmityCo/cleverden
          token: ${{ secrets.CLEVERDEN_TOKEN }}
          path: cleverden

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.have == 'true'
        with:
          python-version: '3.11'

      - name: Install Apollo
        if: steps.gate.outputs.have == 'true'
        run: |
          cleverden/frontend-agentic/apollo/install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Repo variables reach the shell through env, never through ${{ }}
      # interpolated into the script body.
      - name: Register this repo
        if: steps.gate.outputs.have == 'true'
        env:
          APOLLO_PLATFORM: ${{ vars.APOLLO_PLATFORM }}
        run: |
          : "${APOLLO_PLATFORM:?set the APOLLO_PLATFORM repo variable}"
          apollo setup -g
          apollo setup "$GITHUB_WORKSPACE/repo" --key "$APOLLO_PLATFORM"
          apollo doctor || true

      - name: Baseline must be committed
        if: steps.gate.outputs.have == 'true'
        run: |
          if [ ! -f repo/.apollo/baseline.json ]; then
            echo "::error::repo/.apollo/baseline.json is missing. Run 'apollo ground && apollo baseline' locally and commit it — without a floor neither gate can ratchet, and both would pass on anything."
            exit 1
          fi

      # Structure and style: fails only on growth above the floor.
      - name: Structure gate
        if: steps.gate.outputs.have == 'true'
        run: apollo check --repo

      # Spec conformance: same floor, same rule — only new fails block.
      - name: Spec gate
        if: steps.gate.outputs.have == 'true'
        run: |
          apollo ground
          apollo check

      - name: Report
        if: steps.gate.outputs.have == 'true' && always()
        run: apollo check --markdown >> "$GITHUB_STEP_SUMMARY" || true

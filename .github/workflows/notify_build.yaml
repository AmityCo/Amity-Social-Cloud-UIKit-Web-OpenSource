name: Notify build (Eko chat)

# Announces a merged PR to the build-notification topic in Eko chat so other teams
# know a new Web UIKit build is available to check.
#
# Example:
#   🚀 Web UIKit has landed on Staging!
#   🔗 https://uikit.staging.amity.co/
#   🌿 Branch: develop · 🏷️ 0082c742
#   🧩 ts-sdk 7.26.1-86332f0
#   🛠️ Type: Bug fixes
#   🎫 PDT-5155 – auto retry media upload – https://socialplus.atlassian.net/browse/PDT-5155
#   📅 Release date: 15th-Sep-2026
#
# Fires when a PR is merged (pull_request closed + merged == true), and only if the
# PR title starts with `feat` or `fix` (conventional commit prefix) AND contains at
# least one real Jira key (PDT-1234; the PDT-0000 placeholder does not count).
# Anything else (chore, revert, refactor, no ticket, PDT-0000 only) is skipped silently.
#
# Field sources (all from the pull_request event, plus package.json at the merge commit):
#   Environment   base branch == develop → "Staging", otherwise → "Develop"
#   Link          Staging → https://uikit.staging.amity.co/
#                 Develop → https://uikit.dev.amity.co/<PR number>  (what dev.yaml deploys)
#   Branch        pull_request.base.ref
#   Commit        pull_request.merge_commit_sha (short)
#   ts-sdk        @amityco/ts-sdk version in package.json at the merge commit
#   Type          feat → Features, fix → Bug fixes
#   Tickets       PDT-#### keys from the PR title (then body), deduped, title order first
#   Release date  first `Release/<date>` label on the PR (enforced by check_release_label.yaml),
#                 formatted as DD-MMM-YYYY with ordinal, e.g. 25th-Sep-2026
#
# Request format follows scripts/send-message.sh in Social-Plus-React-Native-Uikit-Sample-App:
#   POST {BOT_EKO_CHAT_URL}/{GROUP_ID}/{THREAD_ID}   body: {"message": "..."}
#
# Required secrets:
#   BOT_EKO_CHAT_URL           n8n webhook URL (shared with notify_code_review.yaml)
#   BOT_EKO_CHAT_ACCESS_TOKEN  base64 token, sent as "Authorization: Basic <token>" (shared)
#   EKOAPP_BUILD_GROUP_ID      ID of the group chat for build notifications
#   EKOAPP_BUILD_THREAD_ID     ID of the build-notification topic in that group

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check PR qualifies (feat/fix prefix + Jira ticket in title)
        id: gate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          feat_re='^feat(\([^)]*\))?!?:'
          fix_re='^fix(\([^)]*\))?!?:'
          type=""
          if   [[ "$PR_TITLE" =~ $feat_re ]]; then type="feat"
          elif [[ "$PR_TITLE" =~ $fix_re  ]]; then type="fix"
          fi

          if [ -z "$type" ]; then
            echo "Title does not start with feat/fix — skipping: $PR_TITLE"
            echo "send=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Real Jira keys only — PDT-0000 is a placeholder and does not count.
          real_keys=$(grep -oE 'PDT-[0-9]+' <<< "$PR_TITLE" | grep -vx 'PDT-0000' || true)
          if [ -z "$real_keys" ]; then
            echo "No real Jira ticket (PDT-####, not PDT-0000) in title — skipping: $PR_TITLE"
            echo "send=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "send=true" >> "$GITHUB_OUTPUT"
          echo "type=$type" >> "$GITHUB_OUTPUT"

      - name: Checkout package.json at merge commit
        if: steps.gate.outputs.send == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Build message
        if: steps.gate.outputs.send == 'true'
        id: msg
        env:
          TYPE: ${{ steps.gate.outputs.type }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          JIRA_BROWSE_URL: https://socialplus.atlassian.net/browse
        run: |
          # ── Environment + link ─────────────────────────────────────────────
          if [ "$BASE_REF" = "develop" ]; then
            env_name="Staging"
            link="https://uikit.staging.amity.co/"
          else
            env_name="Develop"
            link="https://uikit.dev.amity.co/${PR_NUMBER}"
          fi

          # ── Commit + SDK version ───────────────────────────────────────────
          commit="${MERGE_SHA:0:8}"
          sdk=$(jq -r '.dependencies["@amityco/ts-sdk"] // .devDependencies["@amityco/ts-sdk"] // .peerDependencies["@amityco/ts-sdk"] // "unknown"' package.json)
          sdk="${sdk#^}"; sdk="${sdk#~}"   # strip range prefix if any

          # ── Type ───────────────────────────────────────────────────────────
          if [ "$TYPE" = "feat" ]; then
            type_line="✨ Type: Features"
          else
            type_line="🛠️ Type: Bug fixes"
          fi

          # ── Tickets ────────────────────────────────────────────────────────
          # Keys in the title get the title's description; keys found only in the body
          # (the "Jira ticket :" section of the PR template) get key + link only.
          title_keys=$(grep -oE 'PDT-[0-9]+' <<< "$PR_TITLE" | grep -vx 'PDT-0000' | awk '!seen[$0]++')
          body_keys=$(grep -oE 'PDT-[0-9]+' <<< "$PR_BODY" | grep -vx 'PDT-0000' | awk '!seen[$0]++' \
                      | grep -vxF -f <(echo "$title_keys") || true)

          # Description = title minus "feat(scope): " prefix, ticket keys, separators, and a trailing "(#123)".
          desc=$(sed -E 's/^(feat|fix)(\([^)]*\))?!?:[[:space:]]*//; s/PDT-[0-9]+[,[:space:]]*//g; s/[[:space:]]*\(#[0-9]+\)[[:space:]]*$//; s/^[[:space:]]*[-–:]+[[:space:]]*//; s/[[:space:]]+$//' <<< "$PR_TITLE")

          ticket_lines=""
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            if [ -n "$desc" ]; then
              ticket_lines+="🎫 ${key} – ${desc} – ${JIRA_BROWSE_URL}/${key}"$'\n'
            else
              ticket_lines+="🎫 ${key} – ${JIRA_BROWSE_URL}/${key}"$'\n'
            fi
          done <<< "$title_keys"
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            ticket_lines+="🎫 ${key} – ${JIRA_BROWSE_URL}/${key}"$'\n'
          done <<< "$body_keys"

          # ── Release date from Release/<date> label, shown as 25th-Sep-2026 ─
          release_raw=$(jq -r '
            [.pull_request.labels[].name | select(startswith("Release/"))]
            | first // "" | sub("^Release/"; "")
          ' "$GITHUB_EVENT_PATH")

          release_date=""
          if [ -n "$release_raw" ]; then
            if epoch=$(date -d "$release_raw" +%s 2>/dev/null); then
              day=$(date -d "@$epoch" +%-d)
              case "$day" in
                1|21|31) sfx="st" ;;
                2|22)    sfx="nd" ;;
                3|23)    sfx="rd" ;;
                *)       sfx="th" ;;
              esac
              release_date="${day}${sfx}-$(date -d "@$epoch" +%b-%Y)"
            else
              release_date="$release_raw"   # label isn't a parsable date; show it as-is
            fi
          fi

          # ── Assemble ───────────────────────────────────────────────────────
          text="🚀 Web UIKit has landed on ${env_name}!"$'\n'
          text+="🔗 ${link}"$'\n'
          text+="🌿 Branch: ${BASE_REF} · 🏷️ ${commit}"$'\n'
          text+="🧩 ts-sdk ${sdk}"$'\n'
          text+="${type_line}"$'\n'
          text+="${ticket_lines}"
          if [ -n "$release_date" ]; then
            text+="📅 Release date: ${release_date}"$'\n'
          fi
          text="${text%$'\n'}"

          echo "Message:"; echo "$text"
          {
            echo "text<<EOF_MSG"
            echo "$text"
            echo "EOF_MSG"
          } >> "$GITHUB_OUTPUT"

      - name: Send to Eko chat
        if: steps.gate.outputs.send == 'true'
        env:
          BOT_EKO_CHAT_URL: ${{ secrets.BOT_EKO_CHAT_URL }}
          BOT_EKO_CHAT_ACCESS_TOKEN: ${{ secrets.BOT_EKO_CHAT_ACCESS_TOKEN }}
          GID: ${{ secrets.EKOAPP_BUILD_GROUP_ID }}
          TID: ${{ secrets.EKOAPP_BUILD_THREAD_ID }}
          TEXT: ${{ steps.msg.outputs.text }}
        run: |
          : "${BOT_EKO_CHAT_URL:?Missing secret BOT_EKO_CHAT_URL}"
          : "${BOT_EKO_CHAT_ACCESS_TOKEN:?Missing secret BOT_EKO_CHAT_ACCESS_TOKEN}"
          : "${GID:?Missing secret EKOAPP_BUILD_GROUP_ID}"
          : "${TID:?Missing secret EKOAPP_BUILD_THREAD_ID}"

          body=$(jq -n --arg message "$TEXT" '{message: $message}')

          status=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
            --location "${BOT_EKO_CHAT_URL}/${GID}/${TID}" \
            -H "Authorization: Basic ${BOT_EKO_CHAT_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$body")

          echo "Eko webhook responded HTTP $status"
          cat /tmp/resp.txt; echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Eko chat notification failed (HTTP $status)"
            exit 1
          fi
